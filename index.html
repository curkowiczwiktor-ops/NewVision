
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NewVision Voting 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🌍 NewVision Voting 2026</h1>
  <p class="subtitle">ONLINE VOTING 2026</p>
</header>

<main>

  <!-- GŁOSOWANIE -->
  <section class="voting" id="votingSection">
    <h2>Choose your 3 favourite countries</h2>
    <p id="counter">Selected: 0/3</p>

    <div id="countries"></div>

    <button id="submit" disabled>SUBMIT VOTES</button>
    <p id="message"></p>
  </section>

  <!-- EKRAN PODZIĘKOWANIA -->
  <section id="thankYou" class="hidden">
    <h1>❤️ THANK YOU!</h1>
    <h2>Thank you for voting!</h2>
    <p>Your votes have been submitted successfully.</p>
    <p>Enjoy NewVision Voting 2026! 🌍</p>
  </section>

  <!-- PANEL ADMINA -->
  <section class="admin">
    <h2>🔐 ADMIN PANEL</h2>

    <div id="login">
      <input id="password" type="password" placeholder="Admin password">
      <button onclick="login()">LOGIN</button>
    </div>

    <div id="results" class="hidden">
      <h3>Voting results</h3>
      <p id="totalVotes"></p>

      <div id="scoreboard"></div>

      <button onclick="resetVotes()" class="reset">
        RESET ALL VOTES
      </button>

      <button onclick="logout()" class="secondary">
        LOGOUT
      </button>
    </div>
  </section>

</main>

<footer>
  NewVision Voting • 2026
</footer>

<script src="script.js"></script>
</body>
</html>
